name: Sync with upstream cosmic-packaging

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: git fetch https://forge.fedoraproject.org/cosmic/cosmic-packaging.git main:refs/remotes/upstream/main

      - name: Merge upstream changes
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged branch
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main

      - name: File issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Merge conflict syncing with upstream cosmic-packaging" \
            --body "Automatic merge from https://forge.fedoraproject.org/cosmic/cosmic-packaging.git failed. Please merge upstream main manually while preserving the removal of Requires: cosmic-player from package-group/cosmic-desktop.spec."